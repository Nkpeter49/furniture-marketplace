{% extends "base.html" %}
{% block title %}Change password · Furniture Marketplace{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<section class="form-panel narrow-panel">
  <form method="post" action="{{ url_for('auth.change_password') }}" class="account-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="current_password">Current password</label>
    <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
    <label for="new_password">New password (at least 12 characters)</label>
    <input id="new_password" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
    <button type="submit">Change password</button>
  </form>
</section>
{% endblock %}
